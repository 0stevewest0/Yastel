<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#006633">
  <title>Login | Yastel Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <div id="toast-container" class="toast-container" aria-live="polite"></div>
  
  <header>
    <div class="nav-container">
      <a href="index.html" class="brand" aria-label="Yastel Hub home">
        <div class="brand-logo">Y</div>
        <div class="brand-text">
          <h1>YASTEL <span class="hub-text">HUB</span></h1>
          <span class="sub-text">YABATECH STUDENT NETWORK</span>
        </div>
      </a>
    </div>
  </header>

  <main class="auth-main">
    <div class="modal-card">
      <h3 style="font-size:1.25rem;font-weight:900;margin-bottom:6px">Student Login</h3>
      <p style="font-size:.84rem;color:var(--muted);margin-bottom:20px">Log in with your matric number and password.</p>
      
            <form id="login-form" autocomplete="on" action="#">
        <div class="form-group">
          <label for="login-matric">Matric Number / ID</label>
          <input 
            id="login-matric" 
            type="text" 
            name="username" 
            autocomplete="username" 
            class="form-control" 
            placeholder="F/ND/24/3210102" 
            pattern="F/ND/[0-9]{2}/[0-9]{7}" 
            title="Use the format F/ND/24/3210102" 
            autocapitalize="characters" 
            required
            >
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input 
            id="login-password" 
            type="password" 
            name="password" 
            autocomplete="current-password" 
            class="form-control" 
            placeholder="Your password" 
            required
          >
        </div>
        <button id="login-submit" type="submit" class="btn btn-green btn-full">LOG IN TO PORTAL</button>
      </form>

      <p style="text-align:center;margin-top:15px;font-size:.84rem;color:var(--muted)">
        Don't have an account yet? <a href="register.html" style="color:var(--green);font-weight:800;text-decoration:none">Sign up here</a>
      </p>
    </div>
  </main>
  <script type="module" src="script.js"></script>
</body>
</html>
